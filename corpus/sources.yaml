# 公开语料清单。
#
# 只提交本文件与下载脚本，语料正文不入库（见 .gitignore 的 corpus/raw/ 与 corpus/**/*.pdf）。
#
# redistributable 三档，语义严格区分：
#   full    — 可直接全文入库（法规、政府文件）
#   excerpt — 只能节选引用，单份不超过原文 10%，原文件不入库
#   none    — 只存链接与条款号，任何情况下都不下载进仓库
#
# 字段约定：
#   url           已核验可访问的直接地址；为 null 时用 resolve 的检索式由人工确认
#   resolve       人工检索式（站点 + 关键词），不是自动抓取目标
#   sections      只取哪几节，对应 excerpt 的切取范围
#   used_in       这份语料服务正文的哪几节，防止收了不用
#   verify        书目信息（标准号、文号）待下载时复核
#
# 主线场景：某注塑厂 3 号线（注塑机 / 模温机 / 冷水机 / 机械手 / 模架）。
# 模具车间（CNC / EDM / 抛光 / 试模）作为对照场景。

version: 1
updated: 2026-10-23
